<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electrical Maintenance System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .forms-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }

    .form-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .form-card:hover {
      transform: translateY(-5px);
    }

    .form-card h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.8em;
      border-bottom: 3px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.95em;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
      display: none;
    }

    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @media (max-width: 768px) {
      .forms-container {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Electrical Maintenance & Health Index System</h1>
    
    <div class="forms-container">
      <!-- Add Equipment Form -->
      <div class="form-card">
        <h2>Add Equipment</h2>
        <form id="equipmentForm" onsubmit="event.preventDefault(); addEquipment();">
          <div class="form-group">
            <label for="name">Equipment Name *</label>
            <input type="text" id="name" placeholder="e.g., Transformer-01" required>
          </div>
          
          <div class="form-group">
            <label for="type">Equipment Type *</label>
            <input type="text" id="type" placeholder="e.g., Transformer, Motor, Switchgear" required>
          </div>
          
          <div class="form-group">
            <label for="location">Location *</label>
            <input type="text" id="location" placeholder="e.g., Building A, Floor 2" required>
          </div>
          
          <button type="submit" class="btn">Add Equipment</button>
          <div id="equipmentMessage" class="message"></div>
        </form>
      </div>

      <!-- Log Maintenance Form -->
      <div class="form-card">
        <h2>Log Maintenance</h2>
        <form id="maintenanceForm" onsubmit="event.preventDefault(); logMaintenance();">
          <div class="form-group">
            <label for="eid">Equipment ID *</label>
            <input type="number" id="eid" placeholder="Enter equipment ID" required min="1">
          </div>
          
          <div class="form-group">
            <label for="mtype">Maintenance Type *</label>
            <select id="mtype" required>
              <option value="">Select type</option>
              <option value="Preventive">Preventive</option>
              <option value="Corrective">Corrective</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="fault">Fault Count *</label>
            <input type="number" id="fault" placeholder="Number of faults" required min="0">
          </div>
          
          <div class="form-group">
            <label for="date">Maintenance Date *</label>
            <input type="date" id="date" required>
          </div>
          
          <button type="submit" class="btn">Log Maintenance</button>
          <div id="maintenanceMessage" class="message"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
